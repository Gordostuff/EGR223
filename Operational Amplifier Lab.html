<style>
/* Layout concept: a bench notebook. Sticky tab strip on top, each module is a control column beside a dark scope screen, with check questions underneath. */
:root{
  --bg:#e9edf1; --surface:#ffffff; --surface-2:#f3f6f8; --ink:#111a22; --muted:#52606c; --line:#c8d1d9;
  --accent:#00695c; --accent-ink:#ffffff; --accent-soft:#d5ece8;
  --good:#146c36; --good-soft:#dcf0e3; --bad:#b3261e; --bad-soft:#f8dedb; --warn:#8a5200; --warn-soft:#f7e8cf;
  --scope-bg:#08171a; --scope-grid:#18393a; --scope-text:#8db8b0;
  --tr-in:#4fc3f7; --tr-out:#ffb347; --tr-ref:#a5d66b; --tr-aux:#ff7ab8;
  --f-head:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d141a; --surface:#151f27; --surface-2:#1b2731; --ink:#e5ecf2; --muted:#98a6b3; --line:#2b3a47;
    --accent:#3fd6c1; --accent-ink:#06211d; --accent-soft:#163832;
    --good:#58d98a; --good-soft:#143323; --bad:#ff8a80; --bad-soft:#3d1c1a; --warn:#f5b84d; --warn-soft:#3a2d12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d141a; --surface:#151f27; --surface-2:#1b2731; --ink:#e5ecf2; --muted:#98a6b3; --line:#2b3a47;
  --accent:#3fd6c1; --accent-ink:#06211d; --accent-soft:#163832;
  --good:#58d98a; --good-soft:#143323; --bad:#ff8a80; --bad-soft:#3d1c1a; --warn:#f5b84d; --warn-soft:#3a2d12;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto;padding-bottom:48px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:2rem;font-weight:700;letter-spacing:.005em}
h2{font-size:1.6rem;font-weight:600}
h3{font-size:1.1rem;font-weight:600;margin-bottom:6px}
p{margin:0 0 10px;max-width:68ch}
.kick{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
header.top{padding:22px 0 14px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
header.top p{color:var(--muted);margin:0;font-size:.9rem}
nav#tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 0;border-bottom:1px solid var(--line);scrollbar-width:thin}
nav#tabs button{flex:none;font:500 .85rem var(--f-body);color:var(--muted);background:transparent;border:1px solid transparent;border-radius:6px;padding:7px 11px;cursor:pointer;white-space:nowrap}
nav#tabs button:hover{color:var(--ink);background:var(--surface)}
nav#tabs button.on{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:none;padding-top:22px}
.panel.on{display:block}
.phead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin-bottom:12px}
.chip{font-family:var(--f-mono);font-size:.72rem;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:4px;padding:2px 7px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card+.card,.card+.lab,.lab+.card,.lab+.lab,p+.card,p+.lab{margin-top:16px}
.lab{display:grid;grid-template-columns:minmax(0,310px) minmax(0,1fr);gap:16px}
@media (max-width:780px){.lab{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.ctl{display:block}
.cr{display:flex;justify-content:space-between;gap:8px;font-size:.85rem}
.cr label{color:var(--muted)}
.cr output{font-family:var(--f-mono);font-size:.82rem;color:var(--ink);text-align:right}
input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0 0}
input[type=range]:disabled{opacity:.35}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.btn{font:500 .84rem var(--f-body);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover,.seg button:hover{border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.scope{width:100%;height:250px;display:block;border-radius:6px;background:var(--scope-bg)}
.scope.short{height:200px}
.reads{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px;margin-top:12px}
.read{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
.read .l{font-size:.72rem;color:var(--muted);display:block}
.read .v{font-family:var(--f-mono);font-size:.95rem;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.read.ok .v{color:var(--good)} .read.bad .v{color:var(--bad)} .read.warn .v{color:var(--warn)}
.eq{font-family:var(--f-mono);font-size:.86rem;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:9px 12px;margin:10px 0;overflow-x:auto;font-variant-numeric:tabular-nums}
.note{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:10px 12px;font-size:.9rem;margin:10px 0}
.note.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.rules{border:1px solid var(--accent);background:var(--accent-soft);border-radius:6px;padding:12px 14px;margin:12px 0}
.rules ol{margin:6px 0 0;padding-left:20px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:12px 0}
.fact{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px}
.fact b{font-family:var(--f-head);font-size:1.05rem;display:block;margin-bottom:4px}
.fact span{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);display:block}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:12px}
.mods button{text-align:left;font:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 13px;cursor:pointer;color:var(--ink)}
.mods button:hover{border-color:var(--accent)}
.mods b{font-family:var(--f-head);font-size:1.02rem;display:block}
.mods span{font-size:.84rem;color:var(--muted)}
.mods .chip{display:inline-block;margin-bottom:5px}
ul.clean{margin:6px 0 10px;padding-left:20px;max-width:68ch}
ul.clean li{margin:3px 0}
.steps{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.step{border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--surface);font-size:.92rem}
.step.cur{border-color:var(--accent);background:var(--accent-soft)}
.step.hide{display:none}
.bars{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.brow{display:grid;grid-template-columns:78px minmax(0,1fr) 78px;gap:8px;align-items:center;font-family:var(--f-mono);font-size:.78rem}
.btrack{position:relative;height:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:3px}
.btrack::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.bfill{position:absolute;top:1px;bottom:1px;border-radius:2px}
svg.sch{width:100%;height:auto;display:block;background:var(--surface-2);border:1px solid var(--line);border-radius:6px}
svg.sch .w{stroke:var(--ink);fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.sch .d{fill:var(--ink)}
svg.sch text{fill:var(--ink);font:12px var(--f-mono)}
svg.sch .m{fill:var(--muted)}
.mcq{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.q{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface)}
.q .qt{font-weight:500;margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;font:inherit;font-size:.9rem;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.exp{margin-top:8px;font-size:.88rem;color:var(--ink);display:none}
.exp.show{display:block}
.mcqh{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.score{font-family:var(--f-mono);font-size:.9rem}
.prob{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface)}
.prob+.prob{margin-top:12px}
.prob .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.prob input[type=number]{width:130px;font:inherit;font-family:var(--f-mono);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink)}
.fb{font-size:.88rem}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.sol{display:none;margin-top:8px;font-size:.88rem}
.sol.show{display:block}
.eqrows{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.eqrow{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px}
.eqrow b{font-family:var(--f-head);display:block}
.eqrow code{font-family:var(--f-mono);font-size:.85rem;display:block;margin-top:3px;overflow-wrap:anywhere}
.eqrow span{font-size:.82rem;color:var(--muted)}
sub,sup{line-height:0}
@media (prefers-reduced-motion:no-preference){.panel.on{animation:fade .18s ease-out}}
@keyframes fade{from{opacity:.4}to{opacity:1}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="kick">Content based on Hayt, Engineering Circuit Analysis, 8th ed. Chapter 6</div>
      <h1>Operational Amplifier Lab</h1>
    </div>
    <p>Change a value. Watch the circuit respond. Then answer the check question.</p>
  </header>

  <main id="panels"></main>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var MIN='−';
var SUPD={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
function sup(n){return String(n).split('').map(function(c){return SUPD[c]||c}).join('')}
function f(x,d){
  d=d||3;
  if(x===undefined||x===null||isNaN(x))return 'n/a';
  if(!isFinite(x))return x>0?'∞':MIN+'∞';
  if(x===0)return '0';
  var a=Math.abs(x),s;
  if(a>=1e6||a<1e-3){var e=Math.floor(Math.log10(a));var m=x/Math.pow(10,e);s=Number(m.toPrecision(d))+'×10'+sup(e);}
  else s=String(Number(x.toPrecision(d)));
  return s.replace('-',MIN);
}
var PRE=[[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p'],[1e-15,'f']];
function eng(x,u){
  if(x===0||!isFinite(x))return f(x)+' '+u;
  var a=Math.abs(x);
  for(var i=0;i<PRE.length;i++){if(a>=PRE[i][0]*0.9995)return f(x/PRE[i][0])+' '+PRE[i][1]+u;}
  return f(x/1e-15)+' f'+u;
}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}

/* ---------- controls ---------- */
var FM={};
function ctrl(id,label,min,max,step,val,fm,log){
  FM[id]=fm;
  return '<div class="ctl"><div class="cr"><label for="'+id+'">'+label+'</label><output id="'+id+'_o"></output></div>'+
    '<input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'"'+(log?' data-log="1"':'')+'></div>';
}
function V(id){var e=$(id);var v=+e.value;return e.dataset.log?Math.pow(10,v):v}
function setV(id,x){var e=$(id);e.value=e.dataset.log?Math.log10(x):x;refreshOut(id)}
function refreshOut(id){var o=$(id+'_o');if(o&&FM[id])o.textContent=FM[id](V(id))}
var fU=function(u,d){return function(v){return f(v,d||3)+' '+u}};
var fE=function(u){return function(v){return eng(v,u)}};
function setSeg(id,key){
  var bs=$(id).querySelectorAll('button');
  for(var i=0;i<bs.length;i++)bs[i].classList.toggle('on',bs[i].dataset.k===key);
}
function reads(items){
  return '<div class="reads">'+items.map(function(it){return '<div class="read" id="'+it[0]+'"><span class="l">'+it[1]+'</span><span class="v">–</span></div>'}).join('')+'</div>';
}
function setRead(id,val,cls){
  var e=$(id);if(!e)return;
  e.querySelector('.v').textContent=val;
  e.className='read'+(cls?' '+cls:'');
}

/* ---------- plotting ---------- */
function setupCv(cv){
  var dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  var g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  return {g:g,w:w,h:h};
}
function niceStep(range,n){
  var raw=range/n,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;
  return (m<1.5?1:m<3?2:m<7?5:10)*p;
}
function plot(cv,o){
  var s=setupCv(cv),g=s.g,w=s.w,h=s.h;
  var cs=getComputedStyle(document.documentElement);
  var C=function(n){return cs.getPropertyValue(n).trim()};
  g.clearRect(0,0,w,h);g.fillStyle=C('--scope-bg');g.fillRect(0,0,w,h);
  var L=50,R=12,T=14,B=o.xlabel?36:24,pw=w-L-R,ph=h-T-B;
  var X=function(x){return L+(x-o.xmin)/(o.xmax-o.xmin)*pw};
  var Y=function(y){return T+(1-(y-o.ymin)/(o.ymax-o.ymin))*ph};
  var mono=C('--f-mono');
  g.font='11px '+mono;
  var sx=niceStep(o.xmax-o.xmin,6),sy=niceStep(o.ymax-o.ymin,6);
  g.strokeStyle=C('--scope-grid');g.fillStyle=C('--scope-text');g.lineWidth=1;
  g.textAlign='center';g.textBaseline='top';
  var x;
  for(x=Math.ceil(o.xmin/sx-1e-9)*sx;x<=o.xmax+sx*1e-6;x+=sx){
    var px=Math.round(X(x))+0.5;g.beginPath();g.moveTo(px,T);g.lineTo(px,T+ph);g.stroke();
    g.fillText(f(+x.toFixed(9),3),px,T+ph+5);
  }
  g.textAlign='right';g.textBaseline='middle';
  var y;
  for(y=Math.ceil(o.ymin/sy-1e-9)*sy;y<=o.ymax+sy*1e-6;y+=sy){
    var py=Math.round(Y(y))+0.5;g.beginPath();g.moveTo(L,py);g.lineTo(L+pw,py);g.stroke();
    g.fillText(f(+y.toFixed(9),3),L-6,py);
  }
  if(o.ymin<0&&o.ymax>0){g.strokeStyle=C('--scope-text');g.globalAlpha=.55;var z=Math.round(Y(0))+0.5;g.beginPath();g.moveTo(L,z);g.lineTo(L+pw,z);g.stroke();g.globalAlpha=1}
  g.save();g.beginPath();g.rect(L,T,pw,ph);g.clip();
  (o.hlines||[]).forEach(function(hl){
    g.strokeStyle=hl.color;g.lineWidth=1.2;g.setLineDash([5,4]);
    var yy=Y(hl.y);g.beginPath();g.moveTo(L,yy);g.lineTo(L+pw,yy);g.stroke();g.setLineDash([]);
  });
  (o.vlines||[]).forEach(function(vl){
    g.strokeStyle=vl.color;g.lineWidth=1.2;g.setLineDash([5,4]);
    var xx=X(vl.x);g.beginPath();g.moveTo(xx,T);g.lineTo(xx,T+ph);g.stroke();g.setLineDash([]);
  });
  (o.series||[]).forEach(function(se){
    g.strokeStyle=se.color;g.lineWidth=se.width||2;g.setLineDash(se.dash||[]);g.lineJoin='round';
    g.beginPath();
    for(var i=0;i<se.x.length;i++){var xx=X(se.x[i]),yy=Y(se.y[i]);if(i===0)g.moveTo(xx,yy);else g.lineTo(xx,yy)}
    g.stroke();g.setLineDash([]);
  });
  (o.markers||[]).forEach(function(mk){
    g.fillStyle=mk.color;g.beginPath();g.arc(X(mk.x),Y(mk.y),5,0,6.2832);g.fill();
  });
  g.restore();
  g.fillStyle=C('--scope-text');g.textBaseline='alphabetic';
  if(o.xlabel){g.textAlign='center';g.fillText(o.xlabel,L+pw/2,h-4)}
  if(o.ylabel){g.textAlign='left';g.fillText(o.ylabel,L+4,T+11)}
  if(o.legend){
    g.textAlign='right';var lx=L+pw-6,ly=T+13;
    o.legend.slice().reverse().forEach(function(lg,i){
      var tw=g.measureText(lg.label).width;
      g.fillStyle=lg.color;g.fillRect(lx-tw-18,ly+i*14-8,10,3);
      g.fillStyle=C('--scope-text');g.fillText(lg.label,lx,ly+i*14);
    });
  }
}

/* ---------- schematic helpers ---------- */
function zig(x1,x2,y){
  var n=6,lead=10,seg=(x2-x1-2*lead)/n,d='M'+x1+' '+y+' L'+(x1+lead)+' '+y;
  for(var i=0;i<n;i++){d+=' L'+(x1+lead+seg*(i+0.5))+' '+(y+(i%2?8:-8))}
  d+=' L'+(x2-lead)+' '+y+' L'+x2+' '+y;
  return '<path class="w" d="'+d+'"/>';
}
function gnd(x,y){return '<path class="w" d="M'+x+' '+y+' v8 M'+(x-11)+' '+(y+8)+' h22 M'+(x-7)+' '+(y+13)+' h14 M'+(x-3)+' '+(y+18)+' h6"/>'}
function dot(x,y){return '<circle class="d" cx="'+x+'" cy="'+y+'" r="3.6"/>'}
function term(x,y){return '<circle class="w" cx="'+x+'" cy="'+y+'" r="4" style="fill:var(--surface-2)"/>'}
function opamp(){
  return '<polygon class="w" points="210,60 210,200 340,130"/>'+
    '<text x="218" y="100">−</text><text x="218" y="170">+</text>';
}
function schem(mode){
  var s='<svg class="sch" viewBox="0 0 540 240" role="img" aria-label="Op amp circuit schematic">'+opamp();
  s+='<path class="w" d="M340 130 H470"/>'+dot(400,130)+term(470,130)+'<text x="470" y="120" text-anchor="middle">vout</text>';
  s+='<path class="w" d="M400 130 V35 H350 M200 35 H150 V95"/>'+dot(150,95);
  s+='<path class="w" d="M150 95 H210"/>';
  if(mode==='inv'){
    s+=zig(350,200,35)+'<text id="sRf" x="275" y="20" text-anchor="middle" class="m"></text>';
    s+='<path class="w" d="M34 95 H50"/>'+zig(50,130,95)+'<path class="w" d="M130 95 H150"/>'+term(30,95)+'<text x="30" y="82" text-anchor="middle">vin</text>';
    s+='<text id="sR1" x="90" y="124" text-anchor="middle" class="m"></text>';
    s+='<path class="w" d="M210 165 H170 V190"/>'+gnd(170,190);
  }else if(mode==='non'){
    s+=zig(350,200,35)+'<text id="sRf" x="275" y="20" text-anchor="middle" class="m"></text>';

/* ---------- MCQ engine ---------- */
function mcq(el,items,final){
  var state={answered:0,right:0};
  var htm=items.map(function(it,i){
    return '<div class="q" data-i="'+i+'"><div class="qt">'+(final?(i+1)+'. ':'')+it.q+'</div><div class="opts">'+
      it.o.map(function(t,j){return '<button class="opt" data-j="'+j+'">'+t+'</button>'}).join('')+
      '</div><div class="exp"></div></div>';
  }).join('');
  el.innerHTML=(final?'<div class="mcqh"><span class="score" id="qscore">0 of '+items.length+' answered</span><button class="btn" id="qreset">Reset quiz</button></div>':'')+htm;
  el.addEventListener('click',function(ev){
    var b=ev.target.closest('.opt');if(b&&!b.disabled){
      var qd=b.closest('.q'),i=+qd.dataset.i,j=+b.dataset.j,it=items[i];
      var opts=qd.querySelectorAll('.opt');
      for(var k=0;k<opts.length;k++){opts[k].disabled=true;if(k===it.a)opts[k].classList.add('right')}
      if(j!==it.a)b.classList.add('wrong');
      var ex=qd.querySelector('.exp');ex.innerHTML=(j===it.a?'<b>Correct.</b> ':'<b>Not quite.</b> ')+it.e;ex.classList.add('show');
      state.answered++;if(j===it.a)state.right++;
      if(final)updateScore();
    }
    if(ev.target.id==='qreset'){mcq(el,items,final)}
  });
  function updateScore(){
    var s=$('qscore');
    s.textContent=state.answered<items.length?state.answered+' of '+items.length+' answered, '+state.right+' correct':
      'Final score: '+state.right+' of '+items.length+' ('+Math.round(100*state.right/items.length)+'%)';
  }
}

function finiteGain(A,Ri,Ro,R1,Rf){var k=(Ro+Rf)/(Ro-A*Rf);var d=k*(1/R1+1/Rf+1/Ri)-1/Rf;return (1/R1)/d}

  var vd=vo/A,iin=vd/Ri;
  setRead('r_g',f(g,7),'');setRead('r_gi',f(gi),'');setRead('r_er',f(Math.abs(er),3)+' %','');
  setRead('r_vd',eng(vd,'V'),'');setRead('r_in',eng(iin,'A'),'');

  setRead('m_err',eng(cm/ratio,'V'),'');

  for(var i=0;i<=N;i++){
    var t=i*dt,u=t-tr,p=u<0?0:(u%(12*tr)),lv;
    if(u<0)lv=0;else if(p<tr)lv=p/tr;else if(p<6*tr)lv=1;else if(p<7*tr)lv=1-(p-6*tr)/tr;else lv=0;
    var tg=2*lv,step=SR*dt;
    y=y+clamp(tg-y,-step,step);
    xs.push(t);vi.push(lv);vo2.push(y);
  }
  plot($('w_cv'),{xmin:0,xmax:xmax,ymin:-0.5,ymax:2.5,series:[{x:xs,y:vi,color:'#4fc3f7'},{x:xs,y:vo2,color:'#ffb347'}],xlabel:'t (µs)',ylabel:'Voltage (V)',legend:[{label:'vin',color:'#4fc3f7'},{label:'vout',color:'#ffb347'}]});

}

function renderComp(){
  var cfg=S.comp,amp=V('k_amp'),off=V('k_off'),ref=V('k_ref');
  var xs=[],vi=[],vr=[],vo=[],N=600,hi=0;
  for(var i=0;i<=N;i++){
    var t=2*i/N,s=off+amp*Math.sin(2*Math.PI*t),vp=cfg.refPlus?ref:s,vn=cfg.refPlus?s:ref,o=vp>vn?cfg.pos:cfg.neg;
    if(o===cfg.pos)hi++;xs.push(t);vi.push(s);vr.push(ref);vo.push(o);
  }
  var lo=Math.min(cfg.neg,off-amp,ref)-1,up=Math.max(cfg.pos,off+amp,ref)+1;
  plot($('k_cv'),{xmin:0,xmax:2,ymin:lo,ymax:up,series:[{x:xs,y:vi,color:'#4fc3f7'},{x:xs,y:vo,color:'#ffb347',width:2.5}],hlines:[{y:ref,color:'#a5d66b'}],xlabel:'t (s)',ylabel:'Voltage (V)',legend:[{label:'signal',color:'#4fc3f7'},{label:'vout',color:'#ffb347'},{label:'reference',color:'#a5d66b'}]});
  setRead('k_hi',f(100*hi/(N+1),3)+' % of the time','');
  setRead('k_th',f(ref)+' V','');
  setRead('k_eps',eng((cfg.pos-cfg.neg)/2/1e5,'V'),'');
  var vd=V('n_vd')/1000,vcm=V('n_vcm'),K1=V('n_k'),K2=K1*(1+V('n_mm')/100);
  var a=K2*(1+K1)/(1+K2),Ad=(a+K1)/2,Acm=Math.abs(a-K1),out=Ad*vd+(a-K1)*vcm,idl=K1*vd,errv=out-idl;
  setRead('n_out',eng(out,'V'),Math.abs(out)>13?'bad':'');setRead('n_idl',eng(idl,'V'),'');
  setRead('n_err',eng(errv,'V'),Math.abs(errv)>0.01*Math.max(Math.abs(idl),1e-9)?'warn':'ok');
  setRead('n_cmrr',Acm<1e-12?'infinite':f(20*Math.log10(Ad/Acm),3)+' dB','');
  $('n_eq').innerHTML='v+ = vcm + vd/2, v− = vcm − vd/2<br>vout = (R4/R3)[(1 + R2/R1)/(1 + R4/R3)] v+ − (R2/R1) v−<br>With R4/R3 = R2/R1 = K, vout = K(v+ − v−). Set the mismatch to 0 to remove the common-mode term. Devices such as the AD622 set K from 1 to 1000 with one external resistor, RG.';
}

  var b=document.createElement('button');b.textContent=p.tab;b.dataset.tab=p.id;tabs.appendChild(b);
});
$('modgrid').innerHTML=P.filter(function(p){return p.id!=='start'}).map(function(p){
  var blurb={rules:'Two rules and a step-by-step derivation',amps:'Gain, phase and clipping on a live scope',sum:'Add signals, subtract signals, build a fuel gauge',cascade:'Chain two stages and watch the gains multiply',sources:'Zener reference and a load-independent current source',real:'Finite gain, CMRR and slew rate',comp:'Open-loop switching and the three op amp in-amp',lab:'Eight sizing problems from the chapter',quiz:'Fourteen questions with worked reasoning',summary:'Equation sheet and habits'}[p.id];
  return '<button data-go="'+p.id+'"><span class="chip">'+(p.sec||'')+'</span><b>'+p.title+'</b><span>'+blurb+'</span></button>';
}).join('');
buildProbs();
document.querySelectorAll('.mcq[data-set]').forEach(function(el){mcq(el,CHECKS[el.dataset.set],false)});
mcq($('finalq'),FINAL,true);

function show(id){
  S.tab=id;
  P.forEach(function(p){$('p_'+p.id).classList.toggle('on',p.id===id)});
  tabs.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===id)});
  var cur=P.filter(function(p){return p.id===id})[0];
  if(cur&&cur.render)cur.render();
  window.scrollTo(0,0);
}
function renderActive(){var cur=P.filter(function(p){return p.id===S.tab})[0];if(cur&&cur.render)cur.render()}

document.querySelectorAll('input[type=range]').forEach(function(e){refreshOut(e.id)});

document.addEventListener('input',function(e){
  if(e.target.type==='range'){refreshOut(e.target.id);renderActive()}
});
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){show(t.dataset.tab);return}
  if(t.dataset.go){show(t.dataset.go);return}
  var par=t.parentElement&&t.parentElement.id;
  if(par==='a_mode'){S.amps=t.dataset.k;setSeg('a_mode',t.dataset.k);renderAmps();return}
  if(par==='a_pre'){
    var k=t.dataset.k;
    if(k==='p1'){S.amps='inv';setV('a_amp',5);setV('a_r1',4.7);setV('a_rf',47);setV('a_sup',15)}
    if(k==='p2'){S.amps='non';setV('a_amp',5);setV('a_r1',4.7);setV('a_rf',47);setV('a_sup',15)}
    if(k==='p3'){setV('a_amp',500);setV('a_sup',15)}
    setSeg('a_mode',S.amps);renderAmps();return;
  }
  if(par==='s_pre'){
    if(t.dataset.k==='kg'){setV('s_r',10);setV('s_rf',4.5)}else{setV('s_r',10);setV('s_rf',10)}
    renderSum();return;
  }
  if(par==='c_pre'){setV('c_r',10);setV('c_rf',10);setV('c_r1',10);setV('c_r2',10);renderCascade();return}
  if(par==='r_pre'){
    var pr={'741':[2e5,2e6,75],'411':[2e5,1e12,1],'549':[1e6,1e13,15]}[t.dataset.k];
    setV('r_a',pr[0]);setV('r_ri',pr[1]);setV('r_ro',pr[2]);setSeg('r_pre',t.dataset.k);renderReal();return;
  }
  if(par==='w_pre'){setV('w_sr',+t.dataset.k);setSeg('w_pre',t.dataset.k);renderReal();return}
  if(par==='k_pre'){
    if(t.dataset.k==='fig635'){S.comp.pos=12;S.comp.neg=-12;setV('k_ref',2.5);setV('k_off',2.5);setV('k_amp',4)}
    else{S.comp.pos=5;S.comp.neg=0;setV('k_ref',3);setV('k_off',3);setV('k_amp',2)}
    setSeg('k_pre',t.dataset.k);renderComp();return;
  }
  if(par==='k_side'){S.comp.refPlus=t.dataset.k==='plus';setSeg('k_side',t.dataset.k);renderComp();return}
  if(t.id==='u_next'){U.step=Math.min(4,U.step+1);renderRules();return}
  if(t.id==='u_back'){U.step=Math.max(0,U.step-1);renderRules();return}
  if(t.id==='u_all'){U.step=4;renderRules();return}
  if(t.dataset.chk!==undefined){
    var i=+t.dataset.chk,p=PROBS[i],v=parseFloat($('pi'+i).value),fb=$('pf'+i);
    if(isNaN(v)){fb.textContent='Enter a number first.';fb.className='fb';return}
    var err=Math.abs(v-p.ans)/p.ans;
    if(err<=p.tol){fb.textContent='Correct.';fb.className='fb ok'}
    else{fb.textContent=(v>p.ans?'Too high':'Too low')+'. Try again or view the solution.';fb.className='fb no'}
    return;
  }
  if(t.dataset.sol!==undefined){$('ps'+t.dataset.sol).classList.toggle('show');return}
});
window.addEventListener('resize',renderActive);

var h=(location.hash||'').replace('#','');
show(P.some(function(p){return p.id===h})?h:'start');
})();
</script>

</body></html>
